[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cambam-builder" # Distribution name for 'pip install'
description = "A framework for building CamBam CAD/CAM files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23.5"]
dynamic = ["version"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0; python_version >= '3.10'"]

[project.scripts]
cambam-mcp = "cambam_builder.mcp_adapter.__main__:main"

[tool.setuptools]
packages = ["cambam_builder", "cambam_builder.mcp_adapter", "legacy_cambam_builder"]

[tool.setuptools.package-data]
"cambam_builder.mcp_adapter" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "cambam_builder.__version__"} # Read the 'version' from the '__version__' attribute of the 'cambam_builder' module

# [project.scripts]
# cambam-cli = "cambam_builder.main:main" # Add cambam_builder/main.py to CLI

